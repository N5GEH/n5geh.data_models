name: "Deploy to GitHub Pages"
description: "Downloads UI artifacts, copies JSON schema data, assembles the static site with navigation pages, and deploys it to GitHub Pages."

inputs:
  OUTPUT_ROOT_PATH:
    description: "The root output path where the swagger UI and schemas will be stored and deployed."
    required: true
  GITHUB_TOKEN:
    description: "GitHub token used to deploy to GitHub Pages."
    required: true
  SITE_ROOT:
    description: "Staging directory assembled and published to GitHub Pages."
    required: false
    default: "_site"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        # Check out the branch tip so freshly generated schemas are available.
        ref: ${{ github.ref }}
    - name: Download all UI artifacts
      uses: actions/download-artifact@v4
      with:
        # Download artifacts into OUTPUT_ROOT_PATH/swagger-ui
        path: ${{ inputs.OUTPUT_ROOT_PATH }}/swagger-ui

    - name: Copy JSON data
      shell: bash
      run: |
        # Create destination folder for JSON schemas.
        mkdir -p "${{ inputs.OUTPUT_ROOT_PATH }}/schemas"
        # Copy all JSON files from JSON_SCHEMA_PATH into the schemas folder.
        cp -R "$JSON_SCHEMA_PATH"/*.json "${{ inputs.OUTPUT_ROOT_PATH }}/schemas/"

    - name: Generate site with navigation pages
      shell: bash
      run: |
        python3 utils/generate_site.py "${{ inputs.OUTPUT_ROOT_PATH }}" \
          --site-root "${{ inputs.SITE_ROOT }}" \
          --repo-root "$GITHUB_WORKSPACE"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.GITHUB_TOKEN }}
        publish_dir: ${{ inputs.SITE_ROOT }}
